<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2A2A35" />
    <meta name="description" content="Portfolio de Agustín, desarrollador de software enfocado en crear productos digitales útiles, funcionales y bien pensados." />
    <meta property="og:title" content="Agustín — Desarrollador de software" />
    <meta property="og:description" content="Programación, tecnología y creatividad para construir productos digitales con intención." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <title>Agustín — Desarrollador de software</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('portfolio-theme');
          const theme = saved === 'light' || saved === 'dark' ? saved : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          const savedLanguage = localStorage.getItem('portfolio-language');
          document.documentElement.lang = savedLanguage === 'es' || savedLanguage === 'en' ? savedLanguage : navigator.language.toLowerCase().startsWith('es') ? 'es' : 'en';
        } catch { document.documentElement.dataset.theme = 'dark'; }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
